name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: smart-notes-board

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-notes-board/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Build
        run: npm run build
